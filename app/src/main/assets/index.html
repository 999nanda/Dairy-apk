<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanda Dairy & Agro - Management System</title>
    <style>
        :root {
            --primary: #1b5e20;
            --danger: #c62828;
            --bg: #f4f6f4;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #login-sec {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .app-sec {
            display: none;
        }
        .card {
            background: #f9fbf9;
            border: 1px solid #d0e1d4;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button.btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button.btn:hover {
            opacity: 0.9;
        }
    </style>
    <!-- Firebase App (compat) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- লগইন সেকশন -->
    <div id="login-sec">
        <h2>Nanda Dairy & Agro</h2>
        <p>লগইন করুন</p>
        <input type="email" id="email" placeholder="User ID">
        <input type="password" id="password" placeholder="password">
        <button id="login-btn" class="btn">login</button>
    </div>

    <!-- ড্যাশবোর্ড ও ডেটাবেজ কন্টেইনার -->
    <div id="app-sec" class="container app-sec">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="background: var(--primary); color: white; padding: 10px; border-radius: 4px; font-weight: bold;">NDA</div>
                <h2 style="margin: 0; color: var(--primary);">Nanda Dairy & Agro</h2>
            </div>
            <button onclick="logout()" style="background: #555; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">লগআউট</button>
        </div>

        <!-- গরুর তথ্য এন্ট্রি কার্ড -->
        <div class="card">
            <h3>🐄 Cattle Record (গরুর তথ্য যোগ করুন)</h3>
            <input type="text" id="cattle-tag" placeholder="Cattle Tag ID / Name (যেমন: Cow-01)">
            <input type="text" id="cattle-breed" placeholder="Breed (যেমন: Jersey / HF)">
            <button onclick="addCattle()" class="btn">Save Cattle Info</button>
        </div>

        <!-- দৈনিক দুধের হিসাব কার্ড -->
        <div class="card">
            <h3>🥛 Milk Production (দৈনিক দুধের হিসাব)</h3>
            <input type="date" id="milk-date">
            <input type="number" id="milk-litres" placeholder="Total Milk in Litres">
            <button onclick="addMilk()" class="btn">Save Milk Record</button>
        </div>

        <!-- সংরক্ষিত তথ্য দেখার সেকশন -->
        <div class="card">
            <h3>📊 Farm Summary</h3>
            <p id="summary-text">তথ্য লোড হচ্ছে...</p>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCIT-87nONARad983vfskY3zTqNucs5NOE",
            authDomain: "nanda-dairy-agro.firebaseapp.com",
            projectId: "nanda-dairy-agro",
            storageBucket: "nanda-dairy-agro.firebasestorage.app",
            messagingSenderId: "999024920419",
            appId: "1:999024920419:web:23bef582efd8701b393556"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Login Event Listener
        document.getElementById('login-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে: " + error.message);
                });
        });

        // Logout Function
        function logout() {
            auth.signOut();
        }

        // Auth State Monitor
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-sec').style.display = 'none';
                document.getElementById('app-sec').style.display = 'block';
            } else {
                document.getElementById('app-sec').style.display = 'none';
                document.getElementById('login-sec').style.display = 'block';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            }
        });

        // Placeholder functions for saving data
        function addCattle() {
            const tag = document.getElementById('cattle-tag').value;
            if(!tag) { alert("দয়া করে গরুর ট্যাগ আইডি দিন"); return; }
            alert("গরুর তথ্য সফলভাবে সংরক্ষিত হয়েছে: " + tag);
            document.getElementById('cattle-tag').value = '';
            document.getElementById('cattle-breed').value = '';
        }

        function addMilk() {
            const litres = document.getElementById('milk-litres').value;
            if(!litres) { alert("দয়া করে দুধের পরিমাণ লিখুন"); return; }
            alert(litres + " লিটার দুধের হিসাব সংরক্ষিত হয়েছে!");
            document.getElementById('milk-litres').value = '';
        }
    </script>
</body>
</html>
