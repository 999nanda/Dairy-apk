<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANDA Dairy & Agro</title>
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Firebase লাইব্রেরি -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- সমস্ত অ্যাপ লজিক ও ফাংশন -->
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAtmDkYLV6rh4jfJT2OPJZ5_R4c99S8-t4",
      authDomain: "nanda-dairy-agro-b5888.firebaseapp.com",
      databaseURL: "https://nanda-dairy-agro-b5888-default-rtdb.firebaseio.com",
      projectId: "nanda-dairy-agro-b5888",
      storageBucket: "nanda-dairy-agro-b5888.firebasestorage.app",
      messagingSenderId: "284932687587",
      appId: "1:284932687587:web:1613d832d65dabfb5f67d6"
    };

    var db = null;
    try {
      if (window.firebase && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      if (window.firebase) {
        db = firebase.database();
      }
    } catch(e) {
      console.log("Firebase notice:", e);
    }

    function unlockApp() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appBody').style.display = 'block';
      listenData();
    }

    function doLogin() {
      var u = (document.getElementById('loginId').value || '').trim().toLowerCase();
      var p = (document.getElementById('loginPass').value || '').trim();
      if (u === 'nanda' && p === '1234') {
        localStorage.setItem('nanda_dairy_auth', 'true');
        unlockApp();
      } else {
        document.getElementById('loginErr').innerText = 'আইডি: nanda এবং পাসওয়ার্ড: 1234 দিন';
      }
    }

    function doLogout() {
      localStorage.removeItem('nanda_dairy_auth');
      location.reload();
    }

    window.onload = function() {
      var today = new Date().toISOString().split('T')[0];
      if (document.getElementById('milkDate')) document.getElementById('milkDate').value = today;
      if (document.getElementById('billDate')) document.getElementById('billDate').value = today;
      if (document.getElementById('expDate')) document.getElementById('expDate').value = today;

      if (localStorage.getItem('nanda_dairy_auth') === 'true') {
        unlockApp();
      }
    };

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.style.display = 'none'; });
      document.querySelectorAll('nav button').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('tab-' + tab).style.display = 'block';
      if (window.event && window.event.target) {
        window.event.target.classList.add('active');
      }
    }

    function calcBill() {
      var qty = parseFloat(document.getElementById('billQty').value) || 0;
      var rate = parseFloat(document.getElementById('billRate').value) || 0;
      var total = qty * rate;
      document.getElementById('billTotal').value = total;

      var paid = parseFloat(document.getElementById('billPaid').value) || 0;
      document.getElementById('billDue').value = total - paid;
    }

    function addCattle() {
      var tag = document.getElementById('cowTag').value.trim();
      var breed = document.getElementById('cowBreed').value.trim();
      var cap = document.getElementById('cowCapacity').value || 0;

      if (!tag) return alert('ট্যাগ নম্বর অবশ্যই দিতে হবে!');
      if (db) db.ref('cattle').push({ tag: tag, breed: breed, cap: cap });
      document.getElementById('cowTag').value = '';
      document.getElementById('cowBreed').value = '';
      document.getElementById('cowCapacity').value = '';
    }

    function addMilkRecord() {
      var date = document.getElementById('milkDate').value;
      var cow = document.getElementById('milkCowTag').value.trim() || 'সাধারণ';
      var session = document.getElementById('milkSession').value;
      var liters = parseFloat(document.getElementById('milkLiters').value) || 0;

      if (!liters) return alert('দুধের পরিমাণ দিন!');
      if (db) db.ref('milk').push({ date: date, cow: cow, session: session, liters: liters });
      document.getElementById('milkLiters').value = '';
    }

    function addBill() {
      var date = document.getElementById('billDate').value;
      var name = document.getElementById('billCustomer').value.trim();
      var phone = document.getElementById('billPhone').value.trim();
      var qty = parseFloat(document.getElementById('billQty').value) || 0;
      var rate = parseFloat(document.getElementById('billRate').value) || 0;
      var total = parseFloat(document.getElementById('billTotal').value) || 0;
      var paid = parseFloat(document.getElementById('billPaid').value) || 0;
      var due = parseFloat(document.getElementById('billDue').value) || 0;

      if (!name) return alert('কাস্টমারের নাম দিন!');
      if (db) db.ref('bills').push({ date: date, name: name, phone: phone, qty: qty, rate: rate, total: total, paid: paid, due: due });
      document.getElementById('billCustomer').value = '';
      document.getElementById('billPhone').value = '';
      document.getElementById('billQty').value = '';
      document.getElementById('billRate').value = '';
      document.getElementById('billTotal').value = '';
      document.getElementById('billPaid').value = '';
      document.getElementById('billDue').value = '';
    }

    function addExpense() {
      var date = document.getElementById('expDate').value;
      var title = document.getElementById('expTitle').value.trim();
      var amount = parseFloat(document.getElementById('expAmount').value) || 0;

      if (!title || !amount) return alert('বিবরণ ও টাকার পরিমাণ দিন!');
      if (db) db.ref('expenses').push({ date: date, title: title, amount: amount });
      document.getElementById('expTitle').value = '';
      document.getElementById('expAmount').value = '';
    }

    function deleteItem(path, id) {
      if (confirm('আপনি কি নিশ্চিতভাবে এই এন্ট্রিটি মুছে ফেলতে চান?')) {
        if (db) db.ref(path).child(id).remove();
      }
    }

    function showInvoice(date, name, phone, qty, rate, total, paid, due) {
      var html = '<p><strong>তারিখ:</strong> ' + date + '</p>' +
                 '<p><strong>কাস্টমার:</strong> ' + name + '</p>' +
                 '<p><strong>মোবাইল:</strong> ' + (phone || 'দেওয়া হয়নি') + '</p>' +
                 '<hr style="margin: 8px 0; border: none; border-top: 1px solid #ddd;">' +
                 '<p>দুধের পরিমাণ: ' + qty + ' লিটার</p>' +
                 '<p>দর: ৳' + rate + ' / লিটার</p>' +
                 '<p><strong>মোট বিল:</strong> ৳' + total + '</p>' +
                 '<p style="color: green;"><strong>পরিশোধ:</strong> ৳' + paid + '</p>' +
                 '<p style="color: red;"><strong>বকেয়া / বাকি:</strong> ৳' + due + '</p>';
      document.getElementById('invoiceDetails').innerHTML = html;
      document.getElementById('invoiceModal').style.display = 'flex';
    }

    function closeInvoice() {
      document.getElementById('invoiceModal').style.display = 'none';
    }

    function listenData() {
      if (!db) return;
      
      db.ref('cattle').on('value', function(snap) {
        var body = document.getElementById('cattleTableBody');
        body.innerHTML = '';
        var count = 0;
        snap.forEach(function(child) {
          count++;
          var d = child.val();
          body.innerHTML += '<tr><td><strong>' + d.tag + '</strong></td><td>' + (d.breed || '-') + '</td><td>' + d.cap + ' লি:</td><td><button class="action-btn btn-danger" onclick="deleteItem(\'cattle\', \'' + child.key + '\')">মুছুন</button></td></tr>';
        });
        document.getElementById('dash-cow-count').innerText = count;
      });

      var today = new Date().toISOString().split('T')[0];
      db.ref('milk').on('value', function(snap) {
        var body = document.getElementById('milkTableBody');
        body.innerHTML = '';
        var todayMilk = 0;
        snap.forEach(function(child) {
          var d = child.val();
          if (d.date === today) todayMilk += Number(d.liters);
          body.innerHTML += '<tr><td>' + d.date + '</td><td>' + d.cow + '</td><td>' + d.session + '</td><td><strong>' + d.liters + ' লি:</strong></td><td><button class="action-btn btn-danger" onclick="deleteItem(\'milk\', \'' + child.key + '\')">মুছুন</button></td></tr>';
        });
        document.getElementById('dash-milk-today').innerText = todayMilk.toFixed(1) + ' লিটার';
      });

      db.ref('bills').on('value', function(snap) {
        var body = document.getElementById('billingTableBody');
        body.innerHTML = '';
        var totalDue = 0;
        snap.forEach(function(child) {
          var d = child.val();
          totalDue += Number(d.due);
          body.innerHTML += '<tr><td>' + d.date + '</td><td><strong>' + d.name + '</strong></td><td>৳' + d.total + '</td><td>৳' + d.paid + '</td><td style="color:red; font-weight:bold;">৳' + d.due + '</td><td><button class="action-btn btn-print" onclick="showInvoice(\'' + d.date + '\', \'' + d.name + '\', \'' + d.phone + '\', \'' + d.qty + '\', \'' + d.rate + '\', \'' + d.total + '\', \'' + d.paid + '\', \'' + d.due + '\')">রসিদ</button><button class="action-btn btn-danger" onclick="deleteItem(\'bills\', \'' + child.key + '\')">মুছুন</button></td></tr>';
        });
        document.getElementById('dash-total-due').innerText = '৳ ' + totalDue.toLocaleString();
      });

      db.ref('expenses').on('value', function(snap) {
        var body = document.getElementById('expenseTableBody');
        body.innerHTML = '';
        var totalExp = 0;
        snap.forEach(function(child) {
          var d = child.val();
          totalExp += Number(d.amount);
          body.innerHTML += '<tr><td>' + d.date + '</td><td>' + d.title + '</td><td>৳' + d.amount + '</td><td><button class="action-btn btn-danger" onclick="deleteItem(\'expenses\', \'' + child.key + '\')">মুছুন</button></td></tr>';
        });
        document.getElementById('dash-total-exp').innerText = '৳ ' + totalExp.toLocaleString();
      });
    }
  </script>
