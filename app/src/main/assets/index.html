<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanda Dairy & Agro - Management System</title>
    <style>
        :root {
            --primary: #1b5e20;
            --danger: #c62828;
            --bg: #f4f6f4;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #login-sec {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .app-sec {
            display: none;
        }
    </style>
    <!-- Firebase App (compat) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

    <!-- লগইন সেকশন -->
    <div id="login-sec">
        <h2>Nanda Dairy & Agro</h2>
        <p>লগইন করুন</p>
        <input type="email" id="email" placeholder="User ID" style="width: 90%; margin-bottom: 10px; padding: 8px;"><br>
        <input type="password" id="password" placeholder="password" style="width: 90%; margin-bottom: 15px; padding: 8px;"><br>
        <button id="login-btn" style="width: 98%; padding: 10px; background: #1b5e20; color: white; border: none; border-radius: 4px; cursor: pointer;">login</button>
    </div>

    <!-- ড্যাশবোর্ড ও ডেটাবেজ কন্টেইনার -->
    <div id="app-sec" class="container app-sec">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="background: var(--primary); color: white; padding: 10px; border-radius: 4px;">NDA</div>
                <h1 class="title" style="font-size: 20px; margin: 0;">Nanda Dairy & Agro</h1>
            </div>
            <button onclick="logout()" style="background: #555; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer;">লগআউট</button>
        </div>
        <div>
            <h3>স্বাগতম, ডেটা যোগ করুন</h3>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForTemplate999",
            authDomain: "nandamunshi1999.firebaseapp.com",
            projectId: "nandamunshi1999",
            storageBucket: "nandamunshi1999.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();

        // Login Event Listener
        document.getElementById('login-btn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    document.getElementById('login-sec').style.display = 'none';
                    document.getElementById('app-sec').style.display = 'block';
                })
                .catch((error) => {
                    alert("লগইন ব্যর্থ হয়েছে: " + error.message);
                });
        });

        // Logout Function
        function logout() {
            auth.signOut().then(() => {
                document.getElementById('app-sec').style.display = 'none';
                document.getElementById('login-sec').style.display = 'block';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });
        }

        // Auth State Monitor
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-sec').style.display = 'none';
                document.getElementById('app-sec').style.display = 'block';
            } else {
                document.getElementById('app-sec').style.display = 'none';
                document.getElementById('login-sec').style.display = 'block';
            }
        });
    </script>
</body>
</html>
